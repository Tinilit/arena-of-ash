name: Validate and deploy game
on:
  push:
    paths-ignore:
      - "public/content/**"
  pull_request:
    paths-ignore:
      - "public/content/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Prepare Chromium
        shell: bash
        run: |
          for arena_browser in chromium google-chrome chromium-browser; do
            arena_browser_path="$(command -v "$arena_browser" || true)"
            if [ -n "$arena_browser_path" ] && "$arena_browser_path" --version; then
              printf 'CHROMIUM_PATH=%s\n' "$arena_browser_path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build -- --base=/arena-of-ash/
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish the uploaded Pages artifact by ID
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error("The Pages upload did not return an artifact ID.");
            }
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            let ready = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100,
              });
              if (data.artifacts.some(artifact => artifact.id === artifactId && !artifact.expired)) {
                ready = true;
                break;
              }
              await delay(5000);
            }
            if (!ready) throw new Error("The uploaded Pages artifact is not visible in the API yet.");
            // Use the exact upload ID: name searches can lag or include previous attempts.
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments", {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken,
              },
            );
            core.setOutput("page_url", deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url?.split("/").pop() || context.sha;
            const failures = new Set([
              "deployment_failed", "deployment_perms_error", "deployment_content_failed",
              "deployment_cancelled", "deployment_lost",
            ]);
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data: status } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}", {
                  ...context.repo, deployment_id: deploymentId,
                },
              );
              core.info(`Pages deployment status: ${status.status}`);
              if (status.status === "succeed") return;
              if (failures.has(status.status)) throw new Error(`Pages deployment failed: ${status.status}`);
              await delay(10000);
            }
            throw new Error("Pages deployment timed out after ten minutes.");
